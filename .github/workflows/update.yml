name: Update Dashboard

on:
  schedule:
    - cron: "0 13 * * *"   # daily ~09:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the OAuth token file you generated locally (see README).
      # Put the contents of your local .auth/*.env file into this secret.
      # NOTE: yfpy's save_access_token_data_to_env_file() defaults to a
      # file literally named ".env" inside env_file_location - it does not
      # use "yfpy.env" or any other name unless the script explicitly
      # passes env_file_name, which yahoo_dashboard.py does not. Writing
      # to any other filename here means yfpy silently can't find the
      # restored token and auth fails in CI (no browser available).
      - name: Restore Yahoo OAuth token
        env:
          YFPY_ENV_FILE: ${{ secrets.YFPY_ENV_FILE }}
        run: |
          mkdir -p .auth
          printf '%s' "$YFPY_ENV_FILE" > .auth/.env

      - name: Generate dashboard
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          YFPY_CONSUMER_KEY: ${{ secrets.YFPY_CONSUMER_KEY }}
          YFPY_CONSUMER_SECRET: ${{ secrets.YFPY_CONSUMER_SECRET }}
          YFPY_AUTH_DIR: .auth
        run: python yahoo_dashboard.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update dashboard $(date -u +%F)" || echo "no changes"
          git push